---
# cPanel Git dagitimi (Turhost paylasimli barindirma).
#
# Yalnizca Laravel API'yi yayina alir. Uc Next.js uygulamasi SSR ve surekli
# calisan bir Node sureci ister; paylasimli pakette cPanel'de "Setup Node.js
# App" yoksa oraya konulamazlar. Ayrinti docs/09-turhost-deploy.md.
#
# GOREVLER DEPO KOKUNDE CALISIR. Kaynak yollari bu yuzden `apps/api/...`
# seklindedir; ilk denemede `app`, `config` gibi yazilmisti ve dagitim
# "cannot stat" ile durdu.
#
# CPANEL ILK HATADA DURUR. Bu yuzden tesihs en basta -- kopyalama patlasa
# bile ortam hakkinda bilgi toplanmis olur.
#
# YAML KURALLARI (hepsi sessiz hataya yol acar)
#   1. Her gorev TEK SATIR.
#   2. Metinlerde iki nokta + BOSLUK kullanma; dosya gecersiz YAML olur ve
#      deploy sessizce duser, "Last Deployed" son basarili commit'te donar.
#   3. Mutlak yol kullan. Deploy kabugunun PATH'i dar, rsync cogu sunucuda yok.
#   4. .env ve storage/ kopyalamadan haric; storage iskeleti mkdir -p ile kurulur.
#   5. Kendi gunlugunu yaz.
#
# Yerlesim: uygulama ev dizininde (~/comiqr), yalniz public/ icerigi
# public_html'de. Alan adinin kok dizinini degistirmeye gerek kalmaz ve .env
# web kokunun DISINDA kalir.
deployment:
  tasks:
    - export DEPLOYPATH=${HOME:-/home/comi3149}
    - export APPPATH=$DEPLOYPATH/comiqr
    - export SRC=apps/api
    - export LOG=$DEPLOYPATH/deploy-son.log
    - /bin/date > $LOG

    # --- Once tesihs (ilk hatada durdugu icin en basta) ---
    - /bin/echo "-- calisma dizini --" >> $LOG
    - /bin/pwd >> $LOG 2>&1
    - /bin/ls >> $LOG 2>&1
    - /bin/echo "-- php --" >> $LOG
    - (command -v php || /bin/echo "php PATH disinda") >> $LOG 2>&1
    - (php -v || /bin/echo "php calismiyor") >> $LOG 2>&1
    - /bin/echo "-- composer --" >> $LOG
    - (command -v composer || /bin/echo "composer PATH disinda") >> $LOG 2>&1
    - /bin/echo "-- vendor --" >> $LOG
    - (/usr/bin/test -f $APPPATH/vendor/autoload.php && /bin/echo "vendor var" || /bin/echo "vendor yok") >> $LOG 2>&1
    - /bin/echo "-- env --" >> $LOG
    - (/usr/bin/test -f $APPPATH/.env && /bin/echo "env var" || /bin/echo "env yok") >> $LOG 2>&1

    # --- Uygulama kodu, web kokunun disina ---
    # storage/ ve .env bilerek disarida. `cp` silmez ama storage'i kopyalamak
    # sunucudaki gunlukleri ve onbellegi ezebilir.
    - /bin/echo "-- kopyalama --" >> $LOG
    - /bin/mkdir -p $APPPATH >> $LOG 2>&1
    - /bin/cp -a $SRC/app $SRC/bootstrap $SRC/config $SRC/database $SRC/deploy $SRC/public $SRC/resources $SRC/routes $APPPATH/ >> $LOG 2>&1
    - /bin/cp -a $SRC/artisan $SRC/composer.json $SRC/composer.lock $APPPATH/ >> $LOG 2>&1

    # --- storage iskeleti (ilk dagitimda yok, Laravel yazamazsa 500 verir) ---
    - /bin/mkdir -p $APPPATH/storage/framework/cache $APPPATH/storage/framework/sessions $APPPATH/storage/framework/views >> $LOG 2>&1
    - /bin/mkdir -p $APPPATH/storage/logs $APPPATH/storage/app/public $APPPATH/bootstrap/cache >> $LOG 2>&1
    - /bin/chmod -R 775 $APPPATH/storage $APPPATH/bootstrap/cache >> $LOG 2>&1

    # --- Web koku, yalniz public/ ---
    - /bin/cp -a $APPPATH/public/. $DEPLOYPATH/public_html/ >> $LOG 2>&1
    # Laravel'in kendi index.php'si uygulamayi bir ust klasorde arar; burada
    # uygulama ev dizininde oldugu icin giris dosyasi degistirilmis surumle ezilir.
    - /bin/cp -f $APPPATH/deploy/public_html-index.php $DEPLOYPATH/public_html/index.php >> $LOG 2>&1

    # --- Eskimis yapilandirma onbellegi .env degisikliklerini gizler ---
    - /bin/rm -f $APPPATH/bootstrap/cache/config.php $APPPATH/bootstrap/cache/routes-v7.php >> $LOG 2>&1
    - /bin/echo "-- bitti --" >> $LOG
