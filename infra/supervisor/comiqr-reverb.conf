; Laravel Reverb — WebSocket server for comiQR real-time (KDS / waiter / POS recall) (B2).
; Install: copy to /etc/supervisor/conf.d/, then:
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start comiqr-reverb
; deploy.sh issues `sudo supervisorctl restart comiqr-reverb` after a release.
; nginx must proxy the public wss:// endpoint to 127.0.0.1:8080.
[program:comiqr-reverb]
process_name=%(program_name)s
command=php /var/www/comiqr/apps/api/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/comiqr/apps/api
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/comiqr/apps/api/storage/logs/reverb.log
