; Laravel Horizon — queue worker supervisor for comiQR (B2).
; Install: copy to /etc/supervisor/conf.d/, then:
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start comiqr-horizon
; deploy.sh issues `php artisan horizon:terminate` so Supervisor restarts it with fresh code.
[program:comiqr-horizon]
process_name=%(program_name)s
command=php /var/www/comiqr/apps/api/artisan horizon
directory=/var/www/comiqr/apps/api
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/comiqr/apps/api/storage/logs/horizon.log
stopwaitsecs=3600
